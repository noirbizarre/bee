# git-tpl — https://noirbizarre.github.io/git-tpl/configuration/
#
# This file is versioned with the project. Edit an answer and run
# `git tpl update` to re-render the template with it.

[template]
source = "https://github.com/noirbizarre/rust.tpl"

[answers]
archive = false
aur = true
aur_package_name = "bee-agent"
author = "Axel H. <noirbizarre@gmail.com>"
bin_name = "bee"
categories = "command-line-utilities,development-tools"
copyright_holder = "Axel H."
copyright_year = 2026
crate = "bee"
description = "A minimal, headless Rust agent runtime implementing ACPv2."
docs = true
docs_accent = "indigo"
homebrew = true
homebrew_tap = "noirbizarre/homebrew-tap"
keywords = "acp,agent,llm,runtime,cli"
kind = "library-and-binary"
man_pages = false
mbx = true
msrv = true
msrv_version = "1.88"
owner = "noirbizarre"
publish = false
rolling_prerelease = true
service = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
