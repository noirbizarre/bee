# bee — A minimal, headless Rust agent runtime implementing ACPv2.
#
# Single crate, library + binary. The library (`src/lib.rs`) holds the engine;
# the binary (`src/main.rs`) is a thin CLI over it, so integration tests can
# exercise either. Cargo discovers both targets on its own.

[package]
name = "bee"
version = "0.1.0"
edition = "2024"
# The MSRV. Checked by the MSRV job in ci.yaml, which greps this very line — keep it
# a plain literal. `rust-toolchain.toml` separately pins the channel to develop
# against; the two answer different questions.
rust-version = "1.88"
license = "MIT"
# No `authors`: Cargo/crates.io stopped generating and reading it after the
# 2021 edition — ownership on crates.io comes from the registry account that
# published, not this field. `author` still feeds LICENSE and, when `aur` is
# on, the PKGBUILD's `# Maintainer:` line.
description = "A minimal, headless Rust agent runtime implementing ACPv2."
repository = "https://github.com/noirbizarre/bee"
homepage = "https://noirbizarre.github.io/bee/"
documentation = "https://noirbizarre.github.io/bee/"
readme = "README.md"
keywords = ["acp", "agent", "llm", "runtime", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Not published to crates.io. Distribution is through the release assets alone,
# and `cargo install bee` would create a second install path that
# nothing tests and nobody updates.
publish = false

# cargo-binstall otherwise derives an asset name from the target triple, and
# the publish workflow's assets carry short platform suffixes instead (the
# `asset` field of each entry in `data/targets.toml`). A wrong guess is not an
# error: binstall silently falls back to compiling from source, which is the
# slow path this exists to avoid. So every target the publish workflow builds
# is mapped by hand, from that same catalogue — one override per selected
# target, so this list never drifts from the publish matrix.
#
# `pkg-fmt = "bin"`: the publish workflow uploads the raw executable, not an
# archive — see publish-release.yaml's "Stage the asset" step.
[package.metadata.binstall]
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/bee_{ version }_linux-amd64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/bee_{ version }_linux-arm64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/bee_{ version }_linux-amd64-musl"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/{ version }/bee_{ version }_linux-arm64-musl"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/bee_{ version }_darwin-amd64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/bee_{ version }_darwin-arm64"

[profile.release]
# Release binaries are cross-compiled once per tag and downloaded many times, so
# the build cost is paid once and the size saving is paid forward.
#
# Cargo only reads [profile.*] from a workspace's root manifest, so this stays
# unconditional: member crates inherit it whether or not this file also
# defines a [package].
lto = true
codegen-units = 1
strip = true

# --- project-specific --------------------------------------------------------
#
# Everything above this line is owned by the template and will keep updating.
# Everything below is yours.
#
# The template seeds what follows once, at `git tpl init`, and then leaves it
# alone: Dependabot bumps versions here weekly, and a template that propagated
# its own would open a conflict against every one of those PRs. Resolve in
# favour of the project if `git tpl update` ever touches it.

[profile.ci]
inherits = "test"
# Full type and variable debug info makes Windows coverage builds memory-heavy;
# line tables retain file/line backtraces without that cost.
debug = "line-tables-only"

[dependencies]
# Errors & diagnostics. `thiserror` for typed errors inside the library,
# `miette` to render them at the binary edge.
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# ACPv2. v2 is the SDK's draft protocol, reachable only through the
# `unstable_protocol_v2` feature, so a minor release may break it. The exact pin
# turns every upgrade into a deliberate, reviewed change instead of a surprise
# from `cargo update`. Only the `acp` boundary imports this crate; see ADR-001.
#
# `stdio` is the SDK's native stdin/stdout transport (ADR-003).
agent-client-protocol = { version = "=3.5.0", features = ["stdio", "unstable_protocol_v2", "unstable_mcp_over_acp"] }

# SDK task cancellation and stream combinators. Tokio supplies model I/O's
# reactor in the binary; the ACP transport itself stays runtime-agnostic.
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }

# Model streams must yield while waiting for I/O so ACP cancellation can run.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "process", "io-util"] }
# Native tools expose cooperative cancellation as well as future-drop cancellation.
tokio-util = { version = "0.7", features = ["rt"] }
# Typed native inputs advertise the same schema that is enforced at dispatch.
serde = { version = "1", features = ["derive", "rc"] }
schemars = "1"
# Schemas are local code, not a reason to fetch URLs or read referenced files.
jsonschema = { version = "0.60", default-features = false }
# Repository-local discovery rules and portable, validated glob syntax.
ignore = "0.4"
globset = "0.4"
# Embed ripgrep's matcher while retaining cooperative, bounded file scanning.
grep-regex = "0.1"
grep-matcher = "0.1"
# Standard skill frontmatter is YAML, including folded scalars and duplicate-key validation.
yaml_serde = "0.10"
unicode-normalization = "0.1"
# Same-directory staging provides complete-content publication and cleanup on drop.
tempfile = "3"
# OS locks release session ownership even when a stdio child is killed.
fs2 = "0.4"

# Layered configuration (ADR-006). Only the generic `Table`/`Value` types are
# used, which sit behind the `serde` feature; `display` (serialization) is not
# needed because Bee never writes configuration.
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

# Provider authentication (ADR-008). Login retains its blocking HTTP seam;
# model streaming uses the async client above (ADR-012). `rustls` rather than
# the system's OpenSSL, so the musl targets need no C library to link against.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# PKCE (RFC 7636) is a SHA-256 of a random verifier, base64url encoded. Each is
# the smallest crate that does exactly that; no OAuth framework, since the one
# flow Bee has is OpenRouter's and a generic client would erase what differs.
sha2 = "0.11"
base64 = "0.23"
# The operating system's CSPRNG, for the PKCE verifier and `state`.
getrandom = "0.4"
# Verify OIDC identity with a maintained implementation, never decoded claims alone.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
# The credential store file and the OpenRouter exchange are JSON. Read by hand
# over `Value`, never derived: serde's error text quotes the offending value, and
# this file is where keys live (the reason `provider.rs` avoids it for TOML).
# Raw payload bytes keep journal checksums stable across serializer upgrades.
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(unix)'.dependencies]
# Safe process-group signaling keeps cancellation cleanup synchronous on drop.
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
# Atomic owner-only directory creation and ACL inspection preserve private
# history on Windows rather than disabling the production session lifecycle.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
# Generate signed test ID tokens against a fixture-owned JWKS.
rsa = { version = "0.9", features = ["pem"] }
# Human interaction deadlines are tested without waiting five real minutes.
tokio = { version = "1", features = ["test-util"] }
# Exercise the official client against a subprocess without adding process
# launching support to Bee's production SDK dependency.
agent-client-protocol = { version = "=3.5.0", features = ["process"] }
# The client side of the MCP-over-ACP spike (tests/mcp.rs, ADR-002). The SDK core
# has no tool builder, so a test client needs this companion crate to host a tool.
# Exact pin and the same two features as the SDK, for the same reason: the draft
# MCP binding may change in a minor release. Dev-only, so Bee itself pulls in no
# rmcp.
agent-client-protocol-rmcp = { version = "=4.0.5", features = ["unstable_protocol_v2", "unstable_mcp_over_acp"] }
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["filters"] }
rstest = "0.28"
pretty_assertions = "1"
