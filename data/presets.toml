# The profiles and browser sign-ins Bee ships (ADR-009).
#
# Data, not code: a user adds to this catalogue, or overrides an entry by name,
# in the `presets` and `login_flows` tables of their own configuration. Native
# discovery adapters remain separate from these declarative sign-in mechanisms.
#
# Deliberately absent:
#
# - model lists. They go stale the day they are written; a profile names its
#   own `model`, or native discovery initializes a missing selection.
# - Cloudflare. Its base URL carries an account id and there is no templating
#   here; the documentation shows a profile to copy.

# A `pkce-key` flow: an authorization-code flow with PKCE (RFC 7636, S256) whose
# exchange returns a credential (an API key), not an access and refresh token.
# The names are the provider's own query parameters and JSON fields.
# Official protocol and API-key lifecycle: docs/adr/021-openrouter-authentication.md.
[login_flows.openrouter]
kind = "pkce-key"
authorize_url = "https://openrouter.ai/auth"
exchange_url = "https://openrouter.ai/api/v1/auth/keys"
# Without a callback OpenRouter shows the code on screen, so `--paste-code` works.
headless = true
help = "OpenRouter's authorization codes expire after 10 minutes and are single use."

[login_flows.openrouter.authorize]
callback = "callback_url"
challenge = "code_challenge"
challenge_method = "code_challenge_method"
state = "state"
# What OpenRouter shows the user as the label of the key it creates.
extra = { key_label = "Bee" }

[login_flows.openrouter.exchange]
code = "code"
verifier = "code_verifier"
challenge_method = "code_challenge_method"
response_key = "key"

# Each preset lists the protocols its provider speaks, each under `protocols`
# with its own `base_url` and `options`. One protocol needs no `prefer`.
[presets.openrouter]
display_name = "OpenRouter"
discovery = "openrouter"
discover_models = true
catalog_provider = "openrouter"
prefer = ["openai-chat", "openai-responses"]
credential = { store = true, login = "openrouter" }

[presets.openrouter.protocols.openai-chat]
base_url = "https://openrouter.ai/api/v1"

# Its Responses API is documented as a beta, so Chat stays preferred.
[presets.openrouter.protocols.openai-responses]
base_url = "https://openrouter.ai/api/v1"

# OpenAI recommends the Responses API for new work, so it is preferred.
[presets.openai]
display_name = "OpenAI"
catalog_provider = "openai"
prefer = ["openai-responses", "openai-chat"]
credential = { env = "OPENAI_API_KEY" }

# The protocols' own default base URL, which is OpenAI's.
[presets.openai.protocols.openai-responses]

[presets.openai.protocols.openai-chat]

# Subscription-backed public Responses access is a separate OAuth audience.
[login_flows.chatgpt]
kind = "chatgpt"

[presets.chatgpt]
display_name = "ChatGPT"
discovery = "chatgpt"
credential = { store = true, login = "chatgpt" }
discover_models = true

[presets.chatgpt.protocols.openai-responses]
base_url = "https://api.openai.com/v1"

[presets.anthropic]
display_name = "Anthropic"
catalog_provider = "anthropic"
credential = { env = "ANTHROPIC_API_KEY" }

# Direct GitHub user-token authentication; device authorization uses a public client.
# See the Copilot authentication ADR for consent identity and wire-contract provenance.
[login_flows.github]
kind = "github"

[presets.github]
display_name = "GitHub Copilot"
auth = "github"
discovery = "github"
discover_models = true
# Models.dev's external provider ID is independent of Bee's shorter preset name.
catalog_provider = "github-copilot"
prefer = ["openai-responses", "anthropic-messages", "openai-chat"]
credential = { store = true, login = "github" }

[presets.github.protocols.openai-chat]
base_url = "https://api.githubcopilot.com"

[presets.github.protocols.openai-responses]
base_url = "https://api.githubcopilot.com"

[presets.github.protocols.anthropic-messages]
base_url = "https://api.githubcopilot.com"

[presets.anthropic.protocols.anthropic-messages]

# A local server needs no credential, which is what no `credential` means.
[presets.ollama]
display_name = "Ollama"

[presets.ollama.protocols.openai-chat]
base_url = "http://localhost:11434/v1"

# --- Gateways and other vendors --------------------------------------------------
#
# Every URL below comes from the vendor's own documentation. A vendor is listed
# by the protocols Bee speaks: Google's native API is not one of them.

# OpenCode Zen, the pay-as-you-go gateway. It serves the open and the free models
# over Chat Completions, the GPT, Grok and Muse models over Responses and the
# Claude models over Messages, so no single protocol reaches them all. Chat is
# preferred because it reaches the most models; configure exact model_protocols
# mappings for models needing another protocol. Its Gemini models use Google's native protocol,
# which Bee does not speak. Another key than Zen's (OpenCode Go has its own
# endpoints under `/inference/go`) needs a profile of its own.
[presets.opencode]
display_name = "OpenCode Zen"
catalog_provider = "opencode"
prefer = ["openai-chat", "openai-responses", "anthropic-messages"]
credential = { env = "OPENCODE_API_KEY" }

[presets.opencode.protocols.openai-chat]
base_url = "https://opencode.ai/inference/openai/v1"

[presets.opencode.protocols.openai-responses]
base_url = "https://opencode.ai/inference/openai/v1"

[presets.opencode.protocols.anthropic-messages]
base_url = "https://opencode.ai/inference/anthropic"

# DeepSeek serves all three from its own API.
[presets.deepseek]
display_name = "DeepSeek"
catalog_provider = "deepseek"
prefer = ["openai-chat", "openai-responses", "anthropic-messages"]
credential = { env = "DEEPSEEK_API_KEY" }

[presets.deepseek.protocols.openai-chat]
base_url = "https://api.deepseek.com"

[presets.deepseek.protocols.openai-responses]
base_url = "https://api.deepseek.com"

[presets.deepseek.protocols.anthropic-messages]
base_url = "https://api.deepseek.com/anthropic"

# Google AI Studio uses the official Gemini Developer API compatibility endpoint.
[presets.google-aistudio]
display_name = "Google AI Studio"
catalog_provider = "google"
discover_models = true
credential = { env = "GEMINI_API_KEY" }

[presets.google-aistudio.protocols.openai-chat]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

# Preserve existing configurations and their opt-in discovery behavior.
[presets.google]
display_name = "Google AI Studio"
catalog_provider = "google"
credential = { env = "GEMINI_API_KEY" }

[presets.google.protocols.openai-chat]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

[presets.groq]
display_name = "Groq"
catalog_provider = "groq"
prefer = ["openai-chat", "openai-responses"]
credential = { env = "GROQ_API_KEY" }

[presets.groq.protocols.openai-chat]
base_url = "https://api.groq.com/openai/v1"

[presets.groq.protocols.openai-responses]
base_url = "https://api.groq.com/openai/v1"

[presets.mistral]
display_name = "Mistral"
catalog_provider = "mistral"
credential = { env = "MISTRAL_API_KEY" }

[presets.mistral.protocols.openai-chat]
base_url = "https://api.mistral.ai/v1"

# xAI's own documentation is written against the Responses API.
[presets.xai]
display_name = "xAI"
catalog_provider = "xai"
prefer = ["openai-responses", "openai-chat"]
credential = { env = "XAI_API_KEY" }

[presets.xai.protocols.openai-responses]
base_url = "https://api.x.ai/v1"

[presets.xai.protocols.openai-chat]
base_url = "https://api.x.ai/v1"
