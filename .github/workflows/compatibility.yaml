name: ACPv2 compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The pinned independent TCK requires Python >=3.14, including its nested uvx process.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: compatibility
          save-on-pull-request: true
      - name: Install the TCK Python runtime
        run: uv python install 3.14
      - name: Build the agent from the pinned dependencies
        run: cargo build --locked
      - name: Run the pinned official TCK with a deterministic provider
        run: uv run --no-project python tests/compatibility.py target/debug/bee --report-json "$RUNNER_TEMP/bee-acp-tck.json"
      - name: Preserve requirement verdicts and wire transcripts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bee-acp-tck
          path: ${{ runner.temp }}/bee-acp-tck.json
          if-no-files-found: warn
